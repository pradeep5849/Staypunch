name: Validate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Provision disposable PostgreSQL and simulated hosted roles
        run: npx tsx scripts/setup-validation-database.ts
      - run: npm run migrate
      - name: Apply explicit application and mailer grants
        run: npm run db:grants
      - run: npm run db:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration
      - name: Disposable backup and restore exercise
        env:
          ALLOW_RESTORE_DRILL: "true"
        run: npm run db:restore-drill
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser and API acceptance
        run: |
          env -u MIGRATION_DATABASE_URL -u EMAIL_DATABASE_URL -u TEST_DATABASE_OWNER_URL -u TEST_DATABASE_URL -u TEST_EMAIL_DATABASE_URL npm run start -- --port 3100 > /tmp/staypunch-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3100/login > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
      - name: Remove disposable validation database
        if: always()
        run: |
          if [ -n "$PG_TOOLS_CONTAINER" ]; then
            docker --host=unix:///var/run/docker.sock rm --force "$PG_TOOLS_CONTAINER"
          fi
