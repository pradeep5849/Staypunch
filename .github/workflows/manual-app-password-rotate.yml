name: Manual StayPunch360 app database password rotation
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type ROTATE-STAYPUNCH-APP-PASSWORD after coordinating Hostinger settings"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: staypunch360-production-database
  cancel-in-progress: false
jobs:
  rotate:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'ROTATE-STAYPUNCH-APP-PASSWORD' }}
    runs-on: ubuntu-latest
    environment: staypunch360-production
    timeout-minutes: 15
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.STAYPUNCH_MIGRATION_DATABASE_URL }}
      STAYPUNCH_APP_DATABASE_PASSWORD: ${{ secrets.STAYPUNCH_APP_DATABASE_PASSWORD }}
      SUPABASE_PROJECT_REF: urprqbipwzzezwaodriy
      DATABASE_SSL: "true"
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Validate protected inputs
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ] || [ -z "$STAYPUNCH_APP_DATABASE_PASSWORD" ]; then
            echo "::error::Missing protected rotation credentials."
            exit 1
          fi
      - name: Install trusted database CA
        env:
          DATABASE_CA_PEM: ${{ secrets.STAYPUNCH_DATABASE_CA_CERT }}
        run: node scripts/install-database-ca.mjs
      - run: npm ci --include=dev
      - name: Rotate only stay_app and verify fresh authentication
        run: npx tsx scripts/rotate-app-database-password.ts
      - name: Remove temporary CA
        if: always()
        run: |
          if [ -n "$DATABASE_CA_CERT_FILE" ]; then
            rm -f -- "$DATABASE_CA_CERT_FILE"
          fi
