name: Manual StayPunch360 deployed admin readiness
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staypunch360-admin-readiness
  cancel-in-progress: false
jobs:
  readiness:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: staypunch360-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked browser validation dependencies
        run: npm ci --include=dev
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check existing administrator without changing business records or credentials
        env:
          ADMIN_CHECK_URL: https://ivory-goat-945051.hostingersite.com
          ADMIN_CHECK_EMAIL: sales.amjconsterior@gmail.com
          ADMIN_CHECK_PASSWORD: ${{ secrets.STAYPUNCH_BOOTSTRAP_ADMIN_PASSWORD }}
        run: npx tsx scripts/check-admin-browser.ts
