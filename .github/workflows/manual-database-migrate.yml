name: Manual StayPunch360 database migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type MIGRATE-STAYPUNCH360 to confirm running migrations against the configured database"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staypunch360-production-database
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirmation == 'MIGRATE-STAYPUNCH360' }}
    runs-on: ubuntu-latest
    environment: staypunch360-production
    timeout-minutes: 15
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.STAYPUNCH_MIGRATION_DATABASE_URL }}
      DATABASE_SSL: 'true'
      NODE_ENV: production
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate required secret
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "::error::Configure STAYPUNCH_MIGRATION_DATABASE_URL in the protected environment."
            exit 1
          fi
      - name: Install trusted database CA certificate
        env:
          DATABASE_CA_PEM: ${{ secrets.STAYPUNCH_DATABASE_CA_CERT }}
        run: |
          if [ -z "$DATABASE_CA_PEM" ]; then
            echo "::error::Add STAYPUNCH_DATABASE_CA_CERT to the protected environment."
            exit 1
          fi
          umask 077
          ca_file="$RUNNER_TEMP/staypunch-database-ca.pem"
          printf '%s\\n' "$DATABASE_CA_PEM" > "$ca_file"
          echo "DATABASE_CA_CERT_FILE=$ca_file" >> "$GITHUB_ENV"
          if ! openssl x509 -in "$ca_file" -noout >/dev/null; then
            echo "::error::The configured database CA certificate is not a valid PEM certificate."
            exit 1
          fi
      - name: Install locked dependencies including TypeScript runner
        run: npm ci --include=dev
      - name: Apply repository migrations
        run: npm run migrate
