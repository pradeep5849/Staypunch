name: Validate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: staypunch
          POSTGRES_PASSWORD: ci-owner-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:ci-owner-only@localhost:5432/staypunch
      TEST_DATABASE_OWNER_URL: postgresql://postgres:ci-owner-only@localhost:5432/staypunch
      DATABASE_URL: postgresql://stay_app:ci-runtime-only@localhost:5432/staypunch
      TEST_DATABASE_URL: postgresql://stay_app:ci-runtime-only@localhost:5432/staypunch
      APP_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - name: Provision restricted test role
        run: |
          psql "$MIGRATION_DATABASE_URL" -c "CREATE ROLE stay_app LOGIN PASSWORD 'ci-runtime-only' NOSUPERUSER NOBYPASSRLS;"
          psql "$MIGRATION_DATABASE_URL" -f db/runtime-grants.sql
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser and API acceptance
        run: |
          npm run start -- --port 3100 > /tmp/staypunch-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3100/login > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
